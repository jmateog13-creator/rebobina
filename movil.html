<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0b1f">
<title>Rebobina · Contestar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --fons:#0e0b1f; --placa:#1b1636; --placa2:#262049; --tinta:#f7f4ff; --suau:#b5acd9; --fosc:#0e0b1f;
  --g1:#ff3d81; --g2:#ffb03b;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif;
  --text:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --osd:"VT323",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--fons);color:var(--tinta);font:400 17px/1.45 var(--text);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
h1,h2{font-family:var(--display);font-weight:900;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.barra{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;min-height:52px;font-weight:700;color:var(--suau);font-size:15px}
.osd{font-family:var(--osd);font-size:22px;color:var(--tinta);letter-spacing:.05em}
.pantalla{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding-block:16px 28px}
.logo{font:900 clamp(40px,12vw,58px)/1 var(--display);letter-spacing:-.03em}
.logo span,.grad{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--suau);max-width:32ch}
form{display:flex;flex-direction:column;gap:12px;width:min(340px,100%)}
.entrada{width:100%;border:0;border-radius:14px;padding:14px;background:#fff;color:var(--fosc);text-align:center;font:900 38px var(--display);letter-spacing:.18em}
.btn{border:0;border-radius:14px;padding:15px;font:900 19px var(--display);background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--fosc);box-shadow:0 5px 0 #0008}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0008}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--placa2);color:var(--tinta)}
.error{background:#c62d29;border-radius:12px;padding:10px 14px;font-weight:700}
.qui{background:var(--placa2);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px}
.icona{font-size:68px;line-height:1}
.gran{font-size:clamp(30px,9vw,40px)}

/* qüestionari */
.q{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:18px}
.punts{display:flex;gap:5px}
.punts i{flex:1;height:6px;border-radius:99px;background:var(--placa2)}
.punts i.fet{background:linear-gradient(90deg,var(--g1),var(--g2))}
.punts i.ara{background:var(--tinta)}
.q h2{font-size:clamp(22px,6.4vw,28px)}
.opcions{display:flex;flex-direction:column;gap:10px}
.op{border:2px solid var(--placa2);background:var(--placa);border-radius:16px;padding:16px 18px;text-align:left;font:700 19px/1.25 var(--text);min-height:60px;transition:transform .05s,border-color .1s}
.op:active{transform:scale(.98)}
.op.triada{border-color:var(--g2);background:linear-gradient(90deg,#ff3d8133,#ffb03b33)}
.num{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:18px}
.num .valor{font:900 clamp(46px,15vw,64px)/1 var(--display)}
.num .fila{display:flex;align-items:center;gap:14px;width:100%}
.num .pm{width:56px;height:56px;border-radius:14px;border:0;background:var(--placa2);font:900 28px var(--display);flex:none}
input[type=range]{flex:1;accent-color:var(--g1);height:36px}
.peu{margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.xarxa{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));background:var(--placa2);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
.caixa{background:var(--placa);border-radius:16px;padding:14px 18px;text-align:left;max-width:520px;width:100%}
</style>
</head>
<body>
<div class="xarxa" id="xarxa" hidden>Reconnectant…</div>
<div class="barra" id="barra" hidden><span class="osd">● REC</span><span>🔒 Anònim</span></div>

<main class="pantalla" id="p-entrar">
  <div class="logo">Rebo<span>bina</span></div>
  <form id="f-entrar" autocomplete="off">
    <input class="entrada" id="codi" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="0000" aria-label="Codi de la sala" required>
    <div class="qui" id="qui" hidden></div>
    <button class="btn" id="b-entrar" disabled>Entrar</button>
    <div class="error" id="e-entrar" hidden></div>
  </form>
</main>

<main class="pantalla" id="p-info" hidden>
  <div id="i-visual"></div>
  <h1 class="gran" id="i-titol"></h1>
  <p class="sub" id="i-sub"></p>
  <div id="i-extra" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px"></div>
</main>

<main class="q" id="p-q" hidden>
  <div class="punts" id="q-punts" aria-hidden="true"></div>
  <span class="osd" id="q-num"></span>
  <h2 id="q-text"></h2>
  <div id="q-cos"></div>
  <div class="peu">
    <button class="btn sec" id="q-enrere" type="button" aria-label="Pregunta anterior">←</button>
    <button class="btn" id="q-seguent" type="button">Següent</button>
  </div>
</main>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DEMO = new URLSearchParams(location.search).has('demo');
const N = DEMO ? null : await import('./sala.js');
const BANC = (await fetch('preguntes.json').then(r => r.json())).preguntes;

let codi = null, uid = null, canal = null, estat = null, espera = null;
let qs = [], i = 0, respostes = {}, enviat = false, confirmat = false;

$('#codi').value = new URLSearchParams(location.search).get('c') || '';
const ver = id => { ['#p-entrar', '#p-info', '#p-q'].forEach(p => $(p).hidden = p !== id); $('#barra').hidden = id === '#p-entrar'; };
function info({ visual = '', titol = '', sub = '', extra = '' }) { $('#i-visual').innerHTML = visual; $('#i-titol').textContent = titol; $('#i-sub').textContent = sub; $('#i-extra').innerHTML = extra; ver('#p-info'); }
const error = m => { const e = $('#e-entrar'); e.textContent = m; e.hidden = false; };
const hm = h => { const t = Math.round(h * 60), H = Math.floor(t / 60), M = t % 60; return M ? `${H} h ${M} min` : `${H} h`; };
const guarda = () => { try { sessionStorage.setItem('rebobina-' + codi, JSON.stringify(respostes)); } catch {} };
const recupera = () => { try { return JSON.parse(sessionStorage.getItem('rebobina-' + codi) || '{}'); } catch { return {}; } };

(async () => {
  if (DEMO) { codi = 'demo'; uid = 'demo'; return alMissatge({ type: 'estat', s: { fase: 'obert', classe: '3C', ids: BANC.map(p => p.id) } }); }
  uid = N.elMeuId();
  $('#qui').textContent = 'Entres de manera anònima: ningú no sabrà qui ets'; $('#qui').hidden = false;
  $('#b-entrar').disabled = false;
  setTimeout(() => { if ($('#codi').value) $('#f-entrar').requestSubmit(); else $('#codi').focus(); });   // quan el formulari ja té el seu onsubmit
})();

$('#f-entrar').onsubmit = e => {
  e.preventDefault();
  const c = $('#codi').value.trim();
  if (!/^\d{4}$/.test(c)) return error('El codi té 4 números');
  $('#e-entrar').hidden = true; $('#b-entrar').disabled = true;
  codi = c; respostes = recupera();
  canal?.surt();
  canal = N.connecta({ codi: c, uid, prefix: 'tut-rebobina-', onMissatge: alMissatge,
    onEstat: st => { $('#xarxa').hidden = st === 'ok'; if (st === 'ok') canal.envia('hola'); } });
  clearTimeout(espera);
  espera = setTimeout(() => { if (!estat) { canal?.surt(); canal = null; error('No hi ha cap sala oberta amb aquest codi'); $('#b-entrar').disabled = false; } }, 6000);
};

function alMissatge(m) {
  if (m.type === 'fora' && m.uid === uid) { clearTimeout(espera); canal?.surt(); canal = null; estat = null; ver('#p-entrar'); error('No pots entrar en aquesta sala.'); $('#b-entrar').disabled = false; return; }
  if (m.type === 'ack' && m.uid === uid) { confirmat = true; if (enviat) pintaEnviat(); return; }
  if (m.type !== 'estat') return;
  const prev = estat; estat = m.s;
  if (!prev) { clearTimeout(espera); if (!DEMO) history.replaceState(null, '', `?c=${codi}`); }
  const s = m.s;
  if (s.fase === 'cerrada') { canal?.surt(); canal = null; $('#barra').hidden = true; return info({ visual: '<div class="icona">👋</div>', titol: 'Sala tancada', sub: 'Gràcies per participar!' }); }
  if (s.fase === 'show') return info({ visual: '<div class="icona">📼</div>', titol: 'Rebobinant…', sub: enviat ? 'Mira la pantalla gran: ara surt el que ha contestat la classe.' : 'Ja hem tancat les respostes. Mira la pantalla gran!' });
  if (s.fase === 'obert') {
    if (prev?.fase === 'obert' && !$('#p-q').hidden) return;   // no interrompre qui està contestant
    qs = BANC.filter(p => s.ids.includes(p.id));
    if (enviat) return pintaEnviat();
    if (!prev || prev.fase !== 'obert') { i = 0; pintaQ(); }
  }
}

/* ---------- qüestionari: una pregunta per pantalla ---------- */
function pintaQ() {
  const p = qs[i];
  $('#q-punts').innerHTML = qs.map((_, j) => `<i class="${j < i ? 'fet' : j === i ? 'ara' : ''}"></i>`).join('');
  $('#q-num').textContent = `${String(i + 1).padStart(2, '0')} / ${String(qs.length).padStart(2, '0')}`;
  $('#q-text').textContent = p.text;
  if (p.tipus === 'num') {
    if (respostes[p.id] == null) respostes[p.id] = p.inicial ?? p.min;
    const v = respostes[p.id];
    $('#q-cos').innerHTML = `<div class="num"><span class="valor" id="n-valor">${hm(v)}</span>
      <div class="fila"><button class="pm" type="button" data-d="-1" aria-label="Menys">−</button>
      <input type="range" id="n-range" min="${p.min}" max="${p.max}" step="${p.pas}" value="${v}" aria-label="${esc(p.text)}">
      <button class="pm" type="button" data-d="1" aria-label="Més">+</button></div></div>`;
  } else {
    $('#q-cos').innerHTML = `<div class="opcions">${p.opcions.map((o, k) => `<button class="op${respostes[p.id] === k ? ' triada' : ''}" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  }
  $('#q-enrere').disabled = i === 0;
  $('#q-seguent').textContent = i === qs.length - 1 ? 'Enviar' : 'Següent';
  $('#q-seguent').disabled = respostes[p.id] == null;
  ver('#p-q');
}
$('#q-cos').addEventListener('input', e => {
  if (e.target.id !== 'n-range') return;
  const p = qs[i]; respostes[p.id] = +e.target.value; $('#n-valor').textContent = hm(respostes[p.id]); guarda();
});
$('#q-cos').addEventListener('click', e => {
  const p = qs[i];
  const pm = e.target.closest('.pm');
  if (pm) { respostes[p.id] = Math.min(p.max, Math.max(p.min, respostes[p.id] + (+pm.dataset.d) * p.pas)); $('#n-range').value = respostes[p.id]; $('#n-valor').textContent = hm(respostes[p.id]); guarda(); return; }
  const op = e.target.closest('.op'); if (!op) return;
  respostes[p.id] = +op.dataset.k; guarda(); navigator.vibrate?.(20);
  document.querySelectorAll('.op').forEach(b => b.classList.toggle('triada', b === op));
  $('#q-seguent').disabled = false;
  setTimeout(() => { if (qs[i] === p && i < qs.length - 1) { i++; pintaQ(); } }, 280);   // avança sol
});
$('#q-enrere').onclick = () => { if (i > 0) { i--; pintaQ(); } };
$('#q-seguent').onclick = async () => {
  if (i < qs.length - 1) { i++; return pintaQ(); }
  enviat = true; confirmat = false; pintaEnviat();
  if (DEMO) { confirmat = true; return setTimeout(pintaEnviat, 300); }
  try { await canal.envia('respostes', { a: respostes }); } catch { info({ visual: '<div class="icona">⚠️</div>', titol: 'No ha arribat', sub: 'Torna-ho a provar.', extra: '<button class="btn" type="button" data-refer>Tornar a enviar</button>' }); }
};
function pintaEnviat() {
  info({ visual: '<div class="icona">📼</div>', titol: confirmat ? 'Enviat!' : 'Enviant…', sub: 'Quan el profe rebobini, mira la pantalla gran.',
    extra: `<div class="caixa">Pots canviar les respostes fins que es rebobini. Ningú no veurà les teves: només les mitjanes de la classe.</div><button class="btn sec" type="button" data-refer>Canviar respostes</button>` });
}
$('#i-extra').addEventListener('click', e => { if (e.target.closest('[data-refer]')) { enviat = false; i = 0; pintaQ(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && canal) canal.envia('hola'); });
</script>
</body>
</html>
